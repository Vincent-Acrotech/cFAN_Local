			// The Tool-Tip instance:
			function ToolTip(canvas, region, text, width, timeout) {				
				var me = this,                                // self-reference for event handlers
				    div = document.createElement("div"),      // the tool-tip div
				    parent = canvas.parentNode,               // parent node for canvas
				    visible = false;                          // current status
			  
				// set some initial styles, can be replaced by class-name etc.
				div.style.cssText = 
					"font-family:monospace;position:fixed;text-align:left;padding:7px;color:white;background:blue;pointer-events:none;width:" + width + "px";
				div.innerHTML = text;
			  
				// show the tool-tip
				this.show = function(pos) {
					if (!visible) {
						var str;
						str = updateTooltipText(region);
						div.innerHTML = str;
									
						visible = true;                           // lock so it's only shown once
						setDivPos(pos);				              // set position												
						parent.appendChild(div);                  // add to parent of canvas
						setTimeout(hide, timeout);                // timeout for hide
					}
				}
			  
				// hide the tool-tip
				function hide() {
					if(visible) {
						visible = false;                            // hide it after timeout					
						parent.removeChild(div);                    // remove from DOM
					}
				}

				// check mouse position, add limits as wanted... just for example:
				function check(e) {					
					var	pos = getPos(e),
						posAbs = {x: e.clientX-80, y: e.clientY},
						index = pos2Index(region),												
						linkStatus = getDvcOnlineStatus(index),
						thickStatus = getImagThickStatus(index);
						//selFlag = getSelImgSelected(index);	
											
					if(!netMode) {
						visible = true;
					}
					
					if((netmodeEdge & 3) == 1) {					
						visible = false;
						netmodeEdge = 3;
					}					
					else if((netmodeEdge & 3) == 2) {
						visible = true;						
						netmodeEdge = 0;
					}						
					
					if (!visible &&
						pos.x >= region.x && pos.x < region.x + region.w &&
						pos.y >= region.y && pos.y < region.y + region.h) {
						
						div.innerHTML = updateDrtData(region);						
						me.show(posAbs);
					}
					else if(visible && netMode) {						
						setDivPos(posAbs); 
						hide();
						/*if(!selFlag) {
							if(linkStatus) {
								clrSelImgConn(index);								
							}
							else {
								setSelImgConn(index);
							}
							setSelImgSelected(index);
							rebuildConn();
							clrSelImgSelected(index);							
						}*/
					}
					else if(visible && !netMode && thickStatus &&
						pos.x >= region.x && pos.x < region.x + region.w &&
						pos.y >= region.y && pos.y < region.y + region.h) {
						
						
						if((updnMode == 1) && (uploadCnt == 0)) {
							uploadCnt++;								
							drawImgUpload(index);
							if(downloadCnt == 0) {
								updnMode = 2;
							}
						}
						else if((updnMode == 2) && (downloadCnt == 0)) {
							downloadCnt++;								
							drawImgDownload(index);
							if(uploadCnt == 0) {
								updnMode = 1;
							}
						}
						//test1.innerHTML = "uploadCnt:"+uploadCnt+"   ";
						//test2.innerHTML = "downloadCnt:"+downloadCnt;
					}
				}
				
				// get mouse position relative to canvas
				function getPos(e) {
					var r = canvas.getBoundingClientRect();
						return {x: e.clientX - r.left, y: e.clientY - r.top}
				}
			  
				// update and adjust div position if needed (anchor to a different corner etc.)
				function setDivPos(pos) {
					if (visible){
						if (pos.x < 0) pos.x = 0;
						if (pos.y < 0) pos.y = 0;
						// other bound checks here
						div.style.left = pos.x + "px";
						div.style.top = pos.y + "px";
					}
				}
			  
				function adjNodeInfoPos(inx) {
					switch(inx) {
						case 0:
							return 0;
						case 1:
							return 1;
						case 2:
							return 3;
						case 3:
							return 2;
						case 4:
							return 1;
						case 5:
							return 0;
					}
				}						

				function updateTooltipText(pos) {
					var text;
					var index = pos2Index(pos);					

					switch(index) {
						case 0:
							text = "Device Name:" + GW_INFO.DeviceName;
							return text;

						case 1:
							text = "Device Name:"      + ROOT_INFO.DeviceName + "<br>" +
								"Device UUID:<br>"     + ROOT_INFO.DeviceUUID + "<br>" +
								"Device Location:<br>" + ROOT_INFO.DeviceLoc;
							return text;							

						case 2:							
							text = "Device Name:"      + LB1_INFO.DeviceName + "<br>" +
								"Device UUID:<br>"     + LB1_INFO.DeviceUUID + "<br>" +
								"Device Location:<br>" + LB1_INFO.DeviceLoc;
							return text;

						case 3:							
							text = "Device Name:"      + LB2_INFO.DeviceName + "<br>" +
								"Device UUID:<br>"     + LB2_INFO.DeviceUUID + "<br>" +
								"Device Location:<br>" + LB2_INFO.DeviceLoc;
							return text;							
						case 4:	
							if(SystemConn.NODE11) {						
								text = "Device Name:"      + NODE1_INFO.DeviceName + "<br>" +
									"Device UUID:<br>"     + NODE1_INFO.DeviceUUID + "<br>" +
									"Device Location:<br>" + NODE1_INFO.DeviceLoc  + "<br>" +
									"Thermohygrometer:<br>"+ NODE1_INFO.THMeter;
							}
							else if(SystemConn.NODE12) {
								text = "Device Name:"      + NODE2_INFO.DeviceName + "<br>" +
									"Device UUID:<br>"     + NODE2_INFO.DeviceUUID + "<br>" +
									"Device Location:<br>" + NODE2_INFO.DeviceLoc  + "<br>" +
									"Thermohygrometer:<br>"+ NODE2_INFO.THMeter;
							}
							return text;

						case 5:
							if(SystemConn.NODE21) {	
								text = "Device Name:"      + NODE2_INFO.DeviceName + "<br>" +
									"Device UUID:<br>"     + NODE2_INFO.DeviceUUID + "<br>" +
									"Device Location:<br>" + NODE2_INFO.DeviceLoc  + "<br>" +
									"Thermohygrometer:<br>"+ NODE2_INFO.THMeter;
							}
							else if(SystemConn.NODE22) {	
								text = "Device Name:"      + NODE2_INFO.DeviceName + "<br>" +
									"Device UUID:<br>"     + NODE2_INFO.DeviceUUID + "<br>" +
									"Device Location:<br>" + NODE2_INFO.DeviceLoc  + "<br>" +
									"Thermohygrometer:<br>"+ NODE2_INFO.THMeter;
							}
							return text;						
					}
				}

				// we need to use shared event handlers:
				//canvas.addEventListener("mousemove", check);
				//canvas.addEventListener("mousedown", check);
				canvas.addEventListener("click", check);				
			}

			function rebuildConn() {

					}
					else if(!gtwSelected.conn) {
						GWLinkRT.linkStatus = false;
					}
					redrawImgLine();
				}
				else if(drt1Selected.selected) {
					if(drt1Selected.conn) {
						RTLinkLB1.linkStatus = true;
					}
					else {

					}

				else if(drt2Selected.selected) {

					}
					else {

				}

			function updateDrtData(pos) {
				if(pos.x==gtwp.x && pos.y==gtwp.y) return gtwtext;
				else if(pos.x==drt1p.x && pos.y==drt1p.y) return drt1text;
				else if(pos.x==drt2p.x && pos.y==drt2p.y) return drt2text;
				else if(pos.x==drt3p.x && pos.y==drt3p.y) return drt3text;
				else if(pos.x==drt4p.x && pos.y==drt4p.y) return drt4text;
				else if(pos.x==drt5p.x && pos.y==drt5p.y) return drt5text;
				else return "not available";
			}
			
			function pos2Index(pos) {
				if(pos.x==gtwp.x && pos.y==gtwp.y) return 0;
				else if(pos.x==drt1p.x && pos.y==drt1p.y) return 1;
				else if(pos.x==drt2p.x && pos.y==drt2p.y) return 2;
				else if(pos.x==drt3p.x && pos.y==drt3p.y) return 3;
				else if(pos.x==drt4p.x && pos.y==drt4p.y) return 4;
				else if(pos.x==drt5p.x && pos.y==drt5p.y) return 5;
				else return 0;

			function clearCanvas() {
				ctx.clearRect(0, 0, c.width, c.height);
			}
			
			function clearLine(start,end) {		
				<!-- setLineDash([x,y]) x=segment px, y=gap px -->		
				ctx.strokeStyle = '#ffffff';
				ctx.lineWidth="1";
				ctx.setLineDash([3,3]);	
				ctx.beginPath();   
				ctx.moveTo(start.x,start.y);  
				ctx.lineTo(end.x,end.y);   		
				ctx.stroke();			
			}
			
			function drawLine(start, end, color, dash) {						
				clearLine(start,end);				
				ctx.strokeStyle = color;
				ctx.lineWidth="1";
				ctx.setLineDash(dash);
				//ctx.setLineDash([]);	
				ctx.beginPath();   
				ctx.moveTo(start.x,start.y);  
				ctx.lineTo(end.x,end.y);   		
				ctx.stroke();	
			}						
			
			function putText(imgTextP,txtFont) {
				ctx.font = txtFont;
				ctx.fillStyle = '#000000';
				ctx.fillText(imgTextP.text, imgTextP.x, imgTextP.y);
			}

			function reaadLbNodes() {
				lb1Edge <<= 1;
				lb2Edge <<= 1;
				node1Edge <<= 1;
				node2Edge <<= 1;

				if(arrangeArray[4] == 1) {
					lb1Edge |= 1;
					SystemConn.LB1 = true;
				}				
				else if(arrangeArray[4] == 2) {
					lb2Edge |= 1;
					SystemConn.LB2 = true;
				}

				if(arrangeArray[9] == 3) {
					node1Edge |= 1;
					if(arrangeArray[4] == 1) {
						SystemConn.NODE11 = true;
						SystemConn.NODE12 = false;
						prevTempHumiInx1 = 1;
					}
					else if(arrangeArray[4] == 2) {
						SystemConn.NODE21 = true;
						SystemConn.NODE22 = false;
						prevTempHumiInx2 = 1;
					}
				}
				else if(arrangeArray[9] == 4) {
					node2Edge |= 1;
					if(arrangeArray[4] == 1) {
						SystemConn.NODE11 = false;
						SystemConn.NODE12 = true;
						prevTempHumiInx1 = 2;
					}
					else if(arrangeArray[4] == 2) {
						SystemConn.NODE21 = false;
						SystemConn.NODE22 = true;
						prevTempHumiInx2 = 2;
					}
				}
				
				if((lb1Edge & maskOffline) == disconData) {
					SystemConn.LB1 = false;
					prevTempHumiInx1 = 0;
				}
				if((lb2Edge & maskOffline) == disconData) {
					SystemConn.LB2 = false;
					prevTempHumiInx2 = 0;
				}
				if((node1Edge & maskOffline) == disconData) {
					SystemConn.NODE11 = false;
					SystemConn.NODE21 = false;
					prevTempHumiInx1 = 0;
				}
				if((node2Edge & maskOffline) == disconData) {
					SystemConn.NODE12 = false;
					SystemConn.NODE22 = false;
					prevTempHumiInx2 = 0;
				}
			}

			function hex2B_Decml(hexH, hexL) {
					var d1 = parseInt(hexH / 16) * 4096;
					var d2 = (hexH & 0x0F) * 256;
					var d3 = parseInt(hexL / 16) * 16;
					var d4 = (hexL & 0x0F);
					return (d1+d2+d3+d4);
			}

			function CalTemperature(tempH, tempL) {					
				var tempDcml = hex2B_Decml(tempH,tempL);
				tempDcml = 175*tempDcml/65535.0- 45.0;
				return tempDcml;
			}				

			function CalHumidity(humiH, humiL) {					
				var humiDcml = hex2B_Decml(humiH,humiL);
				humiDcml = 100.0*humiDcml/65535.0;
				return humiDcml;
			}

			async function linkBluetoothClick() {
				
				if(enConnBLE == 1) {

						filters: [{name: connDeviceName}],
						//acceptAllDevices: true,
						optionalServices: [serviceUuid]		  
						});
						device.addEventListener('gattserverdisconnected', onDisconnected);

						const server = await device.gatt.connect();
						const service = await server.getPrimaryService(serviceUuid);
						notifyCharacteristic = await service.getCharacteristic(notifyCharacteristicUuid);
						writeCharacteristic = await service.getCharacteristic(writeCharacteristicUuid);

						await notifyCharacteristic.startNotifications();
						notifyCharacteristic.addEventListener('characteristicvaluechanged', handleCharacteristicValueChanged);

						Set_Node_Info();

				else {

				console.log(value[1]+"-"+value[2]+"-"+value[3]+"-"+value[4]);
				
				
				// record LIB/NODE linked/unlinked 
				var i;				
				for(i = 1; i <= 4; i++) {
					if(value[i] == 0) {
						if(disconnNode[i-1] < disconnCnt)
						disconnNode[i-1]++;
					}
					else {
						connNode[i-1] = value[i];
						disconnNode[i-1] = 0;
					}
				}
				
				// unlink connection to MeshConn				
				if(disconnNode[0] >= disconnCnt) {
					RoutingLB1to = [0,0,0];
					RoutingLB2to = [0,0,0];
					RoutingN1to = [0,0,0];
					RoutingN2to = [0,0,0];
					disconnNode = [0,0,0,0];
					connNode = [0,0,0,0];
					showLB1 = 0;
				}
				else {
					if(disconnNode[1] >= disconnCnt) {
						RoutingLB2to = [0,0,0];
						connNode[1] = 0;
					}

					if(disconnNode[2] >= disconnCnt) {
						RoutingN1to = [0,0,0];
						connNode[2] = 0;
					}

					if(disconnNode[3] >= disconnCnt) {
						RoutingN2to = [0,0,0];
						connNode[3] = 0;
					}
				}
				
				// link connection to MeshConn
				if(connNode[0] == 1) {
					showLB1 = 1;
					if((connNode[1] == 2) && (connNode[2] == 0) && (connNode[3] == 0)) {
						RoutingLB1to = [1,0,0];
						RoutingLB2to = [1,0,0];
						RoutingN1to = [0,0,0];
						RoutingN2to = [0,0,0];
					}
					else if((connNode[1] == 2) && (connNode[2] == 3) && (connNode[3] == 0)) {
						RoutingLB1to = [1,1,0];
						RoutingLB2to = [1,1,0];
						RoutingN1to = [1,1,0];
						RoutingN2to = [0,0,0];
					}
					else if((connNode[1] == 2) && (connNode[2] == 0) && (connNode[3] == 4)) {
						RoutingLB1to = [1,0,1];
						RoutingLB2to = [1,0,1];
						RoutingN1to = [0,0,0];
						RoutingN2to = [1,1,0];
					}
					else if((connNode[1] == 2) && (connNode[2] == 3) && (connNode[3] == 4)) {
						RoutingLB1to = [1,1,1];
						RoutingLB2to = [1,1,1];
						RoutingN1to = [1,1,1];
						RoutingN2to = [1,1,1];
					}
					else if((connNode[1] == 0) && (connNode[2] == 3) && (connNode[3] == 0)) {
						RoutingLB1to = [0,1,0];
						RoutingLB2to = [0,0,0];
						RoutingN1to = [1,0,0];
						RoutingN2to = [0,0,0];
					}
					else if((connNode[1] == 0) && (connNode[2] == 3) && (connNode[3] == 4)) {
						RoutingLB1to = [0,1,1];
						RoutingLB2to = [0,0,0];
						RoutingN1to = [1,0,1];
						RoutingN2to = [1,0,1];
					}
					else if((connNode[1] == 0) && (connNode[2] == 0) && (connNode[3] == 4)) {
						RoutingLB1to = [0,0,1];
						RoutingLB2to = [0,0,0];
						RoutingN1to = [0,0,0];
						RoutingN2to = [1,0,0];
					}
				}

				//getTempHumiDcml();
				
				//NODE1_INFO.THMeter = TempDcmlN1 + "   " + HumiDcmlN1 + "%";
				//NODE2_INFO.THMeter = TempDcmlN2 + "   " + HumiDcmlN2 + "%";	
							
				//reaadLbNodes();
				//setSysConn();								
				//showSystemConn();				
				//showTempHumi();
				showRootConn();												
				showMeshConn();
				setRouteMap();

				if(disconnCmd == 1) {
					if (device.gatt.connected) {
						device.gatt.disconnect();
						imgBle.src="./image/MdiBluetoothOff.svg";
						disconnCmd = 0;
						enConnBLE = 1;
					}				
				}
			}

			function messageHandler(id, data) {
				if (!messageStore[id]) {
					messageStore[id] = { message: '', reassembled: true };
				}

				const messageInfo = messageStore[id];

				if (data === "SOM") {
					if (messageInfo.reassembled) {
					messageInfo.reassembled = false;
					messageInfo.message = '';
					}
				} else if (data === "EOM") {
					if (!messageInfo.reassembled) {
					messageInfo.reassembled = true;
					}
				} else if (!messageInfo.reassembled) {
					messageInfo.message += data;
				}
			}

			function formatDatetime(date) {
				const year = date.getFullYear();
				const month = (date.getMonth() + 1).toString().padStart(2, '0');
				const day = date.getDate().toString().padStart(2, '0');
				const hours = date.getHours().toString().padStart(2, '0');
				const minutes = date.getMinutes().toString().padStart(2, '0');
				const seconds = (date.getSeconds() + date.getMilliseconds() / 1000).toFixed(2).padStart(5, '0');
				const formattedDatetime = `${year}-${month}-${day}T${hours}:${minutes}:${seconds}Z`;

				return formattedDatetime
			}
