		<style>
			body {font-family: Arial, Helvetica, sans-serif;}
			* {box-sizing: border-box;}

			/* Button used to open the contact form - fixed at the bottom of the page */
			.open-button {
			  background-color: #555;
			  color: white;
			  padding: 16px 20px;
			  border: none;
			  cursor: pointer;
			  opacity: 0.8;
			  position: fixed;
			  bottom: 23px;
			  right: 28px;
			  width: 280px;
			}

			/* The popup form - hidden by default */
			.form-popup {
			  display: none;
			  position: fixed;
			  bottom: 0;
			  right: 15px;
			  border: 3px solid #f1f1f1;
			  z-index: 9;
			}

			/* Add styles to the form container */
			.form-container {
			  max-width: 300px;
			  padding: 10px;
			  background-color: white;
			}

			/* Full-width input fields */
			.form-container input[type=text], .form-container input[type=password] {
			  width: 100%;
			  padding: 15px;
			  margin: 5px 0 22px 0;
			  border: none;
			  background: #f1f1f1;
			}

			/* When the inputs get focus, do something */
			.form-container input[type=text]:focus, .form-container input[type=password]:focus {
			  background-color: #ddd;
			  outline: none;
			}

			/* Set a style for the submit/login button */
			.form-container .btn {
			  background-color: #04AA6D;
			  color: white;
			  padding: 16px 20px;
			  border: none;
			  cursor: pointer;
			  width: 100%;
			  margin-bottom:10px;
			  opacity: 0.8;
			}

			/* Add a red background color to the cancel button */
			.form-container .cancel {
			  background-color: red;
			}

			/* Add some hover effects to buttons */
			.form-container .btn:hover, .open-button:hover {
			  opacity: 1;
			}
		</style>
				
	</head>

				// initial image tooltip text
				gtwtext  = "Device Name: APP",

				drt1text = "Device Name:"         + ROOT_INFO.DeviceName + "<br>" +
						   "Device UUID:<br>"     + ROOT_INFO.DeviceUUID + "<br>" +

				drt2text = "Device Name:"         + LB1_INFO.DeviceName + "<br>" +
						   "Device UUID:<br>"     + LB1_INFO.DeviceUUID + "<br>" +
						   "Device Location:<br>" + LB1_INFO.DeviceLoc,

				drt3text = "Device Name:"         + LB2_INFO.DeviceName + "<br>" +
						   "Device UUID:<br>"     + LB2_INFO.DeviceUUID + "<br>" +
						   "Device Location:<br>" + LB2_INFO.DeviceLoc,

						   "Device Location:<br>" + NODE2_INFO.DeviceLoc,
			
			// create a tool-tip instance:		
				tgtw  = new ToolTip(myCanvas, gtwThin,  gtwtext,  200, 5000),				
				tdrt1 = new ToolTip(myCanvas, drt1Thin, drt1text, 180, 5000),
				tdrt2 = new ToolTip(myCanvas, drt2Thin, drt2text, 180, 5000),
				tdrt3 = new ToolTip(myCanvas, drt3Thin, drt3text, 180, 5000),

			// The Tool-Tip instance:
			function ToolTip(canvas, region, text, width, timeout) {				
				var me = this,                                // self-reference for event handlers
				    div = document.createElement("div"),      // the tool-tip div
				    parent = canvas.parentNode,               // parent node for canvas
				    visible = false;                          // current status
			  
				// set some initial styles, can be replaced by class-name etc.
				div.style.cssText = 
					"font-family:monospace;position:fixed;text-align:left;padding:7px;color:white;background:blue;pointer-events:none;width:" + width + "px";
				div.innerHTML = text;
			  
				// show the tool-tip
				this.show = function(pos) {
					if (!visible) {
						var str;
						str = updateTooltipText(region);
						div.innerHTML = str;
									
						visible = true;                           // lock so it's only shown once
						setDivPos(pos);				              // set position												
						parent.appendChild(div);                  // add to parent of canvas
						setTimeout(hide, timeout);                // timeout for hide
					}
				}
			  
				// hide the tool-tip
				function hide() {
					if(visible) {
						visible = false;                            // hide it after timeout					
						parent.removeChild(div);                    // remove from DOM
					}
				}

				// check mouse position, add limits as wanted... just for example:
				function check(e) {					
					var	pos = getPos(e),
						posAbs = {x: e.clientX-80, y: e.clientY},
						index = pos2Index(region),												
						linkStatus = getDvcOnlineStatus(index),
						thickStatus = getImagThickStatus(index);
						//selFlag = getSelImgSelected(index);	
											
					if(!netMode) {
						visible = true;
					}
					
					if((netmodeEdge & 3) == 1) {					
						visible = false;
						netmodeEdge = 3;
					}					
					else if((netmodeEdge & 3) == 2) {
						visible = true;						
						netmodeEdge = 0;
					}						
					
					if (!visible &&
						pos.x >= region.x && pos.x < region.x + region.w &&
						pos.y >= region.y && pos.y < region.y + region.h) {
						
						div.innerHTML = updateDrtData(region);						
						me.show(posAbs);
					}
					else if(visible && netMode) {						
						setDivPos(posAbs); 
						hide();
						/*if(!selFlag) {
							if(linkStatus) {
								clrSelImgConn(index);								
							}
							else {
								setSelImgConn(index);
							}
							setSelImgSelected(index);
							rebuildConn();
							clrSelImgSelected(index);							
						}*/
					}
					else if(visible && !netMode && thickStatus &&
						pos.x >= region.x && pos.x < region.x + region.w &&
						pos.y >= region.y && pos.y < region.y + region.h) {
						
						
						if((updnMode == 1) && (uploadCnt == 0)) {
							uploadCnt++;								
							drawImgUpload(index);
							if(downloadCnt == 0) {
								updnMode = 2;
							}
						}
						else if((updnMode == 2) && (downloadCnt == 0)) {
							downloadCnt++;								
							drawImgDownload(index);
							if(uploadCnt == 0) {
								updnMode = 1;
							}
						}
						//test1.innerHTML = "uploadCnt:"+uploadCnt+"   ";
						//test2.innerHTML = "downloadCnt:"+downloadCnt;
					}
				}
				
				// get mouse position relative to canvas
				function getPos(e) {
					var r = canvas.getBoundingClientRect();
						return {x: e.clientX - r.left, y: e.clientY - r.top}
				}
			  
				// update and adjust div position if needed (anchor to a different corner etc.)
				function setDivPos(pos) {
					if (visible){
						if (pos.x < 0) pos.x = 0;
						if (pos.y < 0) pos.y = 0;
						// other bound checks here
						div.style.left = pos.x + "px";
						div.style.top = pos.y + "px";
					}
				}
			  
				function adjNodeInfoPos(inx) {
					switch(inx) {
						case 0:
							return 0;
						case 1:
							return 1;
						case 2:
							return 3;
						case 3:
							return 2;
						case 4:
							return 1;
						case 5:
							return 0;
					}
				}						

				function updateTooltipText(pos) {
					var text;
					var index = pos2Index(pos);					

					switch(index) {
						case 0:
							text = "Device Name:" + GW_INFO.DeviceName;
							return text;

						case 1:
							text = "Device Name:"      + ROOT_INFO.DeviceName + "<br>" +
								"Device UUID:<br>"     + ROOT_INFO.DeviceUUID + "<br>" +
								"Device Location:<br>" + ROOT_INFO.DeviceLoc;
							return text;							

						case 2:							
							text = "Device Name:"      + LB1_INFO.DeviceName + "<br>" +
								"Device UUID:<br>"     + LB1_INFO.DeviceUUID + "<br>" +
								"Device Location:<br>" + LB1_INFO.DeviceLoc;
							return text;

						case 3:							
							text = "Device Name:"      + LB2_INFO.DeviceName + "<br>" +
								"Device UUID:<br>"     + LB2_INFO.DeviceUUID + "<br>" +
								"Device Location:<br>" + LB2_INFO.DeviceLoc;
							return text;							
						case 4:	
							if(SystemConn.NODE11) {						
								text = "Device Name:"      + NODE1_INFO.DeviceName + "<br>" +
									"Device UUID:<br>"     + NODE1_INFO.DeviceUUID + "<br>" +
									"Device Location:<br>" + NODE1_INFO.DeviceLoc  + "<br>" +
									"Thermohygrometer:<br>"+ NODE1_INFO.THMeter;
							}
							else if(SystemConn.NODE12) {
								text = "Device Name:"      + NODE2_INFO.DeviceName + "<br>" +
									"Device UUID:<br>"     + NODE2_INFO.DeviceUUID + "<br>" +
									"Device Location:<br>" + NODE2_INFO.DeviceLoc  + "<br>" +
									"Thermohygrometer:<br>"+ NODE2_INFO.THMeter;
							}
							return text;

						case 5:
							if(SystemConn.NODE21) {	
								text = "Device Name:"      + NODE1_INFO.DeviceName + "<br>" +
									"Device UUID:<br>"     + NODE1_INFO.DeviceUUID + "<br>" +
									"Device Location:<br>" + NODE1_INFO.DeviceLoc  + "<br>" +
									"Thermohygrometer:<br>"+ NODE1_INFO.THMeter;
							}
							else if(SystemConn.NODE22) {	
								text = "Device Name:"      + NODE2_INFO.DeviceName + "<br>" +
									"Device UUID:<br>"     + NODE2_INFO.DeviceUUID + "<br>" +
									"Device Location:<br>" + NODE2_INFO.DeviceLoc  + "<br>" +
									"Thermohygrometer:<br>"+ NODE2_INFO.THMeter;
							}
							return text;						
					}
				}

				// we need to use shared event handlers:
				//canvas.addEventListener("mousemove", check);
				//canvas.addEventListener("mousedown", check);
				canvas.addEventListener("click", check);				
			}							

			// get node name
			function getNodeName(index) {
				switch (index) {
					case 0:
						return node0Name;
						break;
					case 1:
						return LB1Name;
						break;
					case 2:

			// namePos: position that renamed
			//			1: Node1Text, 2: Node2Text
			// newNameIndex: index of new name			
			//				0: cFAN_NODE_1, 1: cFAN_NODE_2
			function renameNodeName(namePos, newNameIndex) {
				switch (namePos) {					
					case 0:
						Node1TextP.text = getNodeName(newNameIndex);
						break;
					case 1:

					default:

				}
				//redrawImgLine();

			// input: arrangeArray[4] = node name of LBText2P.text			
			function arrangeNodeName() {

			// show one node image
			// showPos: position
			//			0: Gateway, 1: ROOT
			//			2: LB1, 3: LB2, 3: Node1, 4: Node2
			// showMode: visible/invisible
			//			0: invisible, 1: visible

			// show all node image			
			// Input: arrangeArray[4] = node1 position

			//		  arrangeArray[14] = node3 position
			//		  arrangeArray[19] = node4 position

			//	showPos: 0=unlink

			function clearLine(start,end) {		
				<!-- setLineDash([x,y]) x=segment px, y=gap px -->		
				ctx.strokeStyle = '#ffffff';
				ctx.lineWidth="1";
				ctx.setLineDash([3,3]);	
				ctx.beginPath();   
				ctx.moveTo(start.x,start.y);  
				ctx.lineTo(end.x,end.y);   		
				ctx.stroke();			
			}
			
			function drawLine(start,end) {						
				clearLine(start,end);				
				ctx.strokeStyle = '#0000ff';
				ctx.lineWidth="1";
				ctx.setLineDash([3,3]);	
				ctx.beginPath();   
				ctx.moveTo(start.x,start.y);  
				ctx.lineTo(end.x,end.y);   		
				ctx.stroke();	
			}

			function reaadLbNodes() {
				lb1Edge <<= 1;
				lb2Edge <<= 1;
				node1Edge <<= 1;
				node2Edge <<= 1;

				if(arrangeArray[4] == 1) {
					lb1Edge |= 1;
					SystemConn.LB1 = true;
				}				
				else if(arrangeArray[4] == 2) {
					lb2Edge |= 1;
					SystemConn.LB2 = true;
				}

				if(arrangeArray[9] == 3) {
					node1Edge |= 1;
					if(arrangeArray[4] == 1) {
						SystemConn.NODE11 = true;
						SystemConn.NODE12 = false;
						prevTempHumiInx1 = 1;
					}
					else if(arrangeArray[4] == 2) {
						SystemConn.NODE21 = true;
						SystemConn.NODE22 = false;
						prevTempHumiInx2 = 1;
					}
				}
				else if(arrangeArray[9] == 4) {
					node2Edge |= 1;
					if(arrangeArray[4] == 1) {
						SystemConn.NODE11 = false;
						SystemConn.NODE12 = true;
						prevTempHumiInx1 = 2;
					}
					else if(arrangeArray[4] == 2) {
						SystemConn.NODE21 = false;
						SystemConn.NODE22 = true;
						prevTempHumiInx2 = 2;
					}
				}
				
				if((lb1Edge & maskOffline) == disconData) {
					SystemConn.LB1 = false;
					prevTempHumiInx1 = 0;
				}
				if((lb2Edge & maskOffline) == disconData) {
					SystemConn.LB2 = false;
					prevTempHumiInx2 = 0;
				}
				if((node1Edge & maskOffline) == disconData) {
					SystemConn.NODE11 = false;
					SystemConn.NODE21 = false;
					prevTempHumiInx1 = 0;
				}
				if((node2Edge & maskOffline) == disconData) {
					SystemConn.NODE12 = false;
					SystemConn.NODE22 = false;
					prevTempHumiInx2 = 0;
				}
			}

			function hex2B_Decml(hexH, hexL) {
					var d1 = parseInt(hexH / 16) * 4096;
					var d2 = (hexH & 0x0F) * 256;
					var d3 = parseInt(hexL / 16) * 16;
					var d4 = (hexL & 0x0F);
					return (d1+d2+d3+d4);
			}

			function CalTemperature(tempH, tempL) {					
				var tempDcml = hex2B_Decml(tempH,tempL);
				tempDcml = 175*tempDcml/65535.0- 45.0;
				return tempDcml;
			}				

			function CalHumidity(humiH, humiL) {					
				var humiDcml = hex2B_Decml(humiH,humiL);
				humiDcml = 100.0*humiDcml/65535.0;
				return humiDcml;
			}

			function getTempHumiDcml() {				
				if(arrangeArray[9] == 3) {
					TempDcmlN1 = CalTemperature(arrangeArray[8], arrangeArray[7]);
					HumiDcmlN1 = CalHumidity(arrangeArray[6], arrangeArray[5]);
					TempDcmlN1 = TempDcmlN1.toFixed(1);
					HumiDcmlN1 = HumiDcmlN1.toFixed(1);
				}
				else if(arrangeArray[9] == 4) {
					TempDcmlN2 = CalTemperature(arrangeArray[8], arrangeArray[7]);
					HumiDcmlN2 = CalHumidity(arrangeArray[6], arrangeArray[5]);
					TempDcmlN2 = TempDcmlN2.toFixed(1);
					HumiDcmlN2 = HumiDcmlN2.toFixed(1);
				}				
			}

		<script>			
			async function linkBluetoothClick() {
				
				if(enConnBLE == 1) {
					try {
						device = await navigator.bluetooth.requestDevice({
						//filters: [{services: [serviceUuid]}],
						filters: [{name: connDeviceName}],
						//acceptAllDevices: true,
						optionalServices: [serviceUuid]		  
						});
						device.addEventListener('gattserverdisconnected', onDisconnected);

						const server = await device.gatt.connect();
						const service = await server.getPrimaryService(serviceUuid);
						notifyCharacteristic = await service.getCharacteristic(notifyCharacteristicUuid);
						writeCharacteristic = await service.getCharacteristic(writeCharacteristicUuid);

						await notifyCharacteristic.startNotifications();
						notifyCharacteristic.addEventListener('characteristicvaluechanged', handleCharacteristicValueChanged);
						imgBle.src="./image/FoundationBluetooth.svg";
						enConnBLE = 0;						
						console.log("connected")
						showRootConn();	
						//showLinkedNode();					
						Set_Node_Info();
						arrangeArray[0] = 0;
						arrangeArray[1] = 0;
						arrangeArray[2] = 0;
						arrangeArray[3] = 0;						
					} catch (error) {
						console.error('Error:', error);
					}
				}
				else {
					disconnCmd = 1;
				}														
  			}

			function onDisconnected() {
				console.log("disconnected")
				imgBle.src="./image/MdiBluetoothOff.svg";
				disconnCmd = 0;
				enConnBLE = 1;				
				Init_Node_Info();
				arrangeArray[4] = 0;
				arrangeArray[9] = 0;
				arrangeArray[14] = 0;
				arrangeArray[19] = 0;

			}

			async function sendMessage() {			
				if (writeCharacteristic) {
					//const message = document.getElementById('message').value;
					const message  = '1234';
					const encoder = new TextEncoder('utf-8');
					const data = encoder.encode(message);
					try {
						await writeCharacteristic.writeValue(data);	
						console.log('Message sent');
					} catch (error) {
						console.error('Failed to send message', error);
					}
				} else {
					console.error('Not connected to a device');
				}
			}

			function handleCharacteristicValueChanged(event) {
				const timestamp = formatDatetime(new Date());
				let value = [];		//event.target.value.getUint8(0);
				for(i = 0; i < 15; i++) {
					value[i] = event.target.value.getUint8(i);
				}

				// remove empty node data
				if((value[0] == 0) || (value[0] > 4)) {
					value[0] = 0;
					value[1] = 0;
					value[2] = 0;
					value[3] = 0;
					value[4] = 0;
				}
				if((value[5] == 0) || (value[5] > 4)) {
					value[5] = 0;
					value[6] = 0;
					value[7] = 0;
					value[8] = 0;
					value[9] = 0;
				}
				if((value[10] == 0) || (value[10] > 4)) {
					value[10] = 0;
					value[11] = 0;
					value[12] = 0;
					value[13] = 0;
					value[14] = 0;
				}
				
				// move NTY into arrangeArray
				for(i = 0; i < 15; i++) {					
					if(value[i] == 255) {
						value[i] = 0;
					}
					arrangeArray[14-i] = value[i];					
				}

				// adjust node position
				for(i = 0; i < 15; i++) {
					if(arrangeArray[0] == 0) {
						arrangeArray[0] = arrangeArray[1];
						arrangeArray[1] = arrangeArray[2];
						arrangeArray[2] = arrangeArray[3];
						arrangeArray[3] = arrangeArray[4];
						arrangeArray[4] = arrangeArray[5];
						arrangeArray[5] = arrangeArray[6];
						arrangeArray[6] = arrangeArray[7];
						arrangeArray[7] = arrangeArray[8];
						arrangeArray[8] = arrangeArray[9];
						arrangeArray[9] = arrangeArray[10];
						arrangeArray[10] = arrangeArray[11];
						arrangeArray[11] = arrangeArray[12];
						arrangeArray[12] = arrangeArray[13];
						arrangeArray[13] = arrangeArray[14];
						arrangeArray[14] = arrangeArray[15];
						arrangeArray[15] = 0;						
					}
					else {
						break;
					}				
				}				

				getTempHumiDcml();
				
				NODE1_INFO.THMeter = TempDcmlN1 + "   " + HumiDcmlN1 + "%";
				NODE2_INFO.THMeter = TempDcmlN2 + "   " + HumiDcmlN2 + "%";	
							
				reaadLbNodes();
				setSysConn();								
				showSystemConn();				
				showTempHumi();												

				if(disconnCmd == 1) {
					if (device.gatt.connected) {
						device.gatt.disconnect();
						imgBle.src="./image/MdiBluetoothOff.svg";
						disconnCmd = 0;
						enConnBLE = 1;
					}				
				}
			}

			function messageHandler(id, data) {
				if (!messageStore[id]) {
					messageStore[id] = { message: '', reassembled: true };
				}

				const messageInfo = messageStore[id];

				if (data === "SOM") {
					if (messageInfo.reassembled) {
					messageInfo.reassembled = false;
					messageInfo.message = '';
					}
				} else if (data === "EOM") {
					if (!messageInfo.reassembled) {
					messageInfo.reassembled = true;
					}
				} else if (!messageInfo.reassembled) {
					messageInfo.message += data;
				}
			}

			function formatDatetime(date) {
				const year = date.getFullYear();
				const month = (date.getMonth() + 1).toString().padStart(2, '0');
				const day = date.getDate().toString().padStart(2, '0');
				const hours = date.getHours().toString().padStart(2, '0');
				const minutes = date.getMinutes().toString().padStart(2, '0');
				const seconds = (date.getSeconds() + date.getMilliseconds() / 1000).toFixed(2).padStart(5, '0');
				const formattedDatetime = `${year}-${month}-${day}T${hours}:${minutes}:${seconds}Z`;

				return formattedDatetime
			}
